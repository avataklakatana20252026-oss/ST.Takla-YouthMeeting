plugins { id 'com.android.application' }
android {
    namespace 'org.tekla.jesusprayer'
    compileSdk 35
    signingConfigs {
        release {
            if (System.getenv("NOTETY_KEYSTORE_PATH")) {
                storeFile file(System.getenv("NOTETY_KEYSTORE_PATH"))
                storePassword System.getenv("NOTETY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NOTETY_KEY_ALIAS")
                keyPassword System.getenv("NOTETY_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    defaultConfig {
        applicationId 'org.tekla.jesusprayer'
        minSdk 23
        targetSdk 35
        versionCode 30
        versionName '30.0'
    }
}
