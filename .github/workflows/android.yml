name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish verified APK to public GitHub Releases"
        type: boolean
        default: false
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test local activity and report persistence
        run: node tools/test_records.cjs
      - name: Validate all local Bible verse numbers
        run: python3 tools/test_bible_numbering.py
      - name: Import and validate all 365 original annual-plan days
        run: python3 tools/import_annual.py
      - uses: actions/upload-artifact@v4
        with:
          name: Annual-plan-audit
          path: annual_audit.json
          if-no-files-found: error
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTETY_KEYSTORE_BASE64 }}
          NOTETY_KEYSTORE_PASSWORD: ${{ secrets.NOTETY_KEYSTORE_PASSWORD }}
          NOTETY_KEY_ALIAS: ${{ secrets.NOTETY_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing keystore secret}"
          : "${NOTETY_KEYSTORE_PASSWORD:?Missing password secret}"
          : "${NOTETY_KEY_ALIAS:?Missing alias secret}"
          umask 077
          KEYFILE="$RUNNER_TEMP/notety-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYFILE"
          keytool -list -keystore "$KEYFILE" -storepass:env NOTETY_KEYSTORE_PASSWORD -alias "$NOTETY_KEY_ALIAS" >/dev/null
          echo "NOTETY_KEYSTORE_PATH=$KEYFILE" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          NOTETY_KEYSTORE_PASSWORD: ${{ secrets.NOTETY_KEYSTORE_PASSWORD }}
          NOTETY_KEY_ALIAS: ${{ secrets.NOTETY_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signing certificate
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: Notety-ElRouhiya-v31-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish verified APK (manual approval only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle)
          [[ "$VERSION" =~ ^[0-9]+$ ]]
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists. Increase versionCode for a new release." >&2
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/notety.apk"
          gh release create "$TAG" "$RUNNER_TEMP/notety.apk" --target "$GITHUB_SHA" --title "Notety El Rouhiya $TAG" --notes "نوتتي الروحية — إصدار أندرويد موقّع. ثبّته فوق الإصدار السابق إذا كان بنفس التوقيع." --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/notety-signing.jks"
